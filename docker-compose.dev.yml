services:
  postgres:
    image: postgres:16-alpine
    container_name: arsabil_postgres_dev
    environment:
      POSTGRES_DB: arsabil_dev
      POSTGRES_USER: arsabil
      POSTGRES_PASSWORD: arsabil_dev_pass
    ports:
      # 5433 (host) — 5432 zaten Desktop/KPSS/backend'in kendi postgres container'ında kullanılıyor.
      - "5433:5432"
    volumes:
      - arsabil_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arsabil -d arsabil_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  arsabil_pgdata:
    name: arsabil_pgdata
